<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>HMS - Kunda Health Care is offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #0f172a; background: #f1f5f9; }
      main { width: min(100%, 520px); padding: 40px; text-align: center; border: 1px solid #dbe4ee; border-radius: 24px; background: #fff; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12); }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { margin: 24px 0 12px; font-size: clamp(1.75rem, 5vw, 2.25rem); }
      p { margin: 0 auto 28px; max-width: 40ch; color: #475569; line-height: 1.6; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 12px; color: #fff; background: #0f172a; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #34d399; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>HMS - Kunda Health Care needs a connection for secure, up-to-date hospital information. Reconnect, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
